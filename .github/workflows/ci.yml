name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: build / vet / test (Go ${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # go.mod（v3 と v3/providers）の最小版と、最新の安定版の両方で確かめる
        go: ["1.22", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: make check
        run: make check

  race:
    name: test with race detector
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      # ubuntu-latest には gcc が入っているので cgo（-race に必要）がそのまま使える
      - name: make test-race
        run: make test-race

  module:
    # 外のモジュールから go get で 2 つのモジュール（github.com/tjst-t/sakutei/v3 と
    # github.com/tjst-t/sakutei/v3/providers）を取り込み、build できるか。タグではその版、
    # main ではその commit（擬似版）を取りに行く。PR はまだ公開されていないので回さない。
    name: consumable as Go modules
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: go get github.com/tjst-t/sakutei/v3{,/providers}@<this version> and build
        run: |
          if [ "${{ github.ref_type }}" = tag ]; then v="${{ github.ref_name }}"; else v="${{ github.sha }}"; fi
          make check-module VERSION="$v"
