# Redfish と Workflow で OS を入れる（docs/trial/redfish-os-install/README.md）。
# 2026-10-22 の試用で回した intent。ISO（/iso/sakutei-autoinstall.iso）は利用者が用意する。
resources:
  # インストールが済んだあとの「あるべき姿」: 電源オン・起動先の上書きなし（ディスクから起動）
  - provider: redfish-system
    id: node1
    fields:
      power: "On"
      boot_enabled: Disabled
  # CD には自動インストールの ISO を差したままにする（起動先の上書きが無ければディスクから起動する）
  - provider: redfish-virtual-media
    id: node1/cd
    fields:
      image: /iso/sakutei-autoinstall.iso

workflows:
  - workflow: os-install
    applicant: trial
    target:
      provider: redfish-system
    strategy:
      order: one-at-a-time
    stages:
      - name: install
        targets:
          - node1
    steps:
      # 1. CD から起動する（インストーラが走る）
      - apply:
          boot_enabled: Continuous
          boot_target: Cd
          power: "On"
      # 2. インストーラが終わって電源を切るのを待つ
      - wait:
          fields:
            power: "Off"
          timeout: 15m
      # 3. ディスクから起動する
      - apply:
          boot_enabled: Disabled
          power: "On"
