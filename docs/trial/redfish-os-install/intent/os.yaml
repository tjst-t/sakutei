# Redfish と Workflow で OS を入れる（docs/trial/redfish-os-install/README.md）。
# 2026-10-22 の試用で回した intent。ISO（/iso/sakutei-autoinstall.iso）は利用者が用意する。
resources:
  # インストールが済んだあとの「あるべき姿」: 電源オン・起動先の上書きなし（ディスクから起動）
  - provider: redfish-system
    id: node1
    fields:
      power: "On"
      boot_enabled: Disabled
  # 終わったら CD は抜く（Workflow が done になるまでは Workflow に任せ、収束ループは触らない）
  - provider: redfish-virtual-media
    id: node1/cd
    fields:
      image: ""

workflows:
  - workflow: os-install
    applicant: trial
    target:
      provider: redfish-system
    strategy:
      order: one-at-a-time
    stages:
      - name: install
        targets:
          - node1
    steps:
      # 1. CD（別の provider）に自動インストールの ISO を差す
      - apply:
          resource: redfish-virtual-media/{target}/cd
          fields:
            image: /iso/sakutei-autoinstall.iso
      # 2. 差さったことを確かめる（前提条件。満たさないまま 5 分過ぎたら halt）
      - require:
          resource: redfish-virtual-media/{target}/cd
          fields:
            image: /iso/sakutei-autoinstall.iso
          timeout: 5m
      # 3. CD から起動する（インストーラが走る）
      - apply:
          boot_enabled: Continuous
          boot_target: Cd
          power: "On"
      # 4. インストーラが終わって電源を切るのを待つ
      - wait:
          fields:
            power: "Off"
          timeout: 15m
      # 5. ディスクから起動する
      - apply:
          boot_enabled: Disabled
          power: "On"
