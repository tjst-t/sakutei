# v1 を試すための intent（docs/trial/README.md）。
# dnszone の id は「FQDN/型」（例 www.example.com./A）。name も同じ FQDN。相対名の id はロードで拒否される。
# nftables の id は「family/table/chain」。rules は順序つきで、区切りは " ; "。
version: "1"
resources:
  - provider: dnszone
    id: www.example.com./A
    fields:
      name: www.example.com.
      type: A
      value: 192.0.2.20
      ttl: "300"
  # api-begin（run.sh の手順 6 がこの範囲を消して試す）
  - provider: dnszone
    id: api.example.com./A
    fields:
      name: api.example.com.
      type: A
      value: 192.0.2.30
      ttl: "300"
  # api-end
  - provider: nftables
    id: inet/filter/sakutei_allow
    fields:
      family: inet
      table: filter
      chain: sakutei_allow
      rules: tcp dport 22 accept ; tcp dport 443 accept
