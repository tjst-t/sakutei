# 新しいコアの redfish provider の統合テスト（v3 段 8b）のトポロジ。v2 の
# tests/integration/redfish と同じ qemu-bmc 0.11.0 を 2 台。lab・管理ネットの
# 名前とアドレスは v2 の lab（sakutei-rf84・172.31.84.0/24）と重ならないものにして、
# 2 つを同時に回せるようにしている。
#
#   host (sakutei) ── sakutei-v3rf (172.31.93.0/24) ──┬─ node1 BMC 172.31.93.11
#                                                      └─ node2 BMC 172.31.93.12
#   node1 VM NIC (eth1) ──────────── node2 VM NIC (eth1)
#
# ディスクは作らない。ディスクの無い VM は BIOS のまま ACPI の電源ボタンに応えない
# ので、GracefulShutdown は PoweringOff のあと GRACEFUL_TIMEOUT 秒で On に戻る
# （既定の停止が効かず、効かない回数で止まるのを確かめる）。./iso（テストが作る
# 小さな ISO）を /iso に読み取り専用で差す。
name: sakutei-v3rf

mgmt:
  network: sakutei-v3rf
  ipv4-subnet: 172.31.93.0/24

topology:
  defaults:
    kind: linux
    image: ghcr.io/tjst-t/qemu-bmc:0.11.0@sha256:3ab6ea901b1ae8a510a2a140113fd1d80ad0f3ad2c26327ab04ef94f95bbdfc9
    devices:
      - /dev/kvm
      - /dev/net/tun
    binds:
      - ./iso:/iso:ro
    env:
      VM_MEMORY: "256"
      VM_CPUS: "1"
      IPMI_USER: "admin"
      IPMI_PASS: "password"
      VM_NETWORKS: "eth1"
      GRACEFUL_TIMEOUT: "10"
      # FW の更新の模擬の BMC の Task の長さ（秒）。
      FIRMWARE_UPDATE_SECONDS: "3"

  nodes:
    node1:
      mgmt-ipv4: 172.31.93.11
      env:
        SYSTEM_UUID: "6f1b7c52-0e1a-4d2b-9c11-000000009301"
        VM_MACS: "52:54:00:93:01:01"
        # 初めの FW の版（FW の更新の段が宣言と比べる）。
        BMC_FIRMWARE_VERSION: "1.0.0"
        BIOS_FIRMWARE_VERSION: "BIOS-1.0.0"
    node2:
      mgmt-ipv4: 172.31.93.12
      env:
        SYSTEM_UUID: "6f1b7c52-0e1a-4d2b-9c11-000000009302"
        VM_MACS: "52:54:00:93:02:01"
        # 障害注入の口（平文の HTTP。管理ネットに直に届くので publish しない）。
        FAULT_API_ADDR: ":8623"

  links:
    - endpoints: ["node1:eth1", "node2:eth1"]
